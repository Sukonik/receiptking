<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7f2" />
    <meta name="description" content="ReceiptKing turns receipt scans into clean purchasing records and spreadsheet exports." />
    <title>ReceiptKing | Receipt automation, built simply</title>
    <link id="favicon32" rel="icon" href="assets/brand/icons/hackberry/favicon-32.png" type="image/png" sizes="32x32" />
    <link id="appleIcon" rel="apple-touch-icon" href="assets/brand/icons/hackberry/apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      // Replay the saved palette before first paint so themes never flash.
      try {
        var ui = JSON.parse(localStorage.getItem("receiptking-ui") || "{}");
        if (ui.paint) for (var k in ui.paint) document.documentElement.style.setProperty(k, ui.paint[k]);
        if (ui.dark) document.documentElement.dataset.mode = "dark";
        document.documentElement.dataset.icon = /^[a-z]+$/.test(ui.icon || "") ? ui.icon : "hackberry";
      } catch (e) {}
      try {
        var d = JSON.parse(localStorage.getItem("receiptking-v1") || "null");
        window.__rkRestored = !!(d && d.rows && d.rows.some(function (r) { return r.budgetCode || r.amount || r.reason; }));
      } catch (e) {}
    </script>
    <link rel="preload" as="image" href="assets/brand/logos/clerk-mask.webp" type="image/webp" />
    <link rel="preload" as="image" href="assets/brand/logos/clerk-detail.webp" type="image/webp" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" media="print" onload="this.media='all'" />
  </head>
  <body>
    <div id="top-slot" class="topbar-slot">
      <header class="topbar"><div class="brand"><span class="brand-mark" aria-hidden="true"></span><div class="brand-name">ReceiptKing</div></div></header>
    </div>
    <section class="hero" id="hero">
      <div class="hero-copy">
        <div class="eyebrow">Receipt automation, built simply</div>
        <h1>From receipt pile to <span>clean records.</span></h1>
        <p>Drop a screenshot or PDF, or photograph a paper receipt. Review the suggested amount, add the budget code, and export.</p>
        <div class="feature-row"><div class="feature-chip">Photo, screenshot, or PDF</div><div class="feature-chip">PDF, Excel, CSV</div><div class="feature-chip">No account required</div></div>
      </div>
      <div class="hero-logo" role="img" aria-label="ReceiptKing Clerk holding a receipt"><span class="hero-logo__body"></span><span class="hero-logo__detail"></span></div>
    </section>
    <div id="root"></div>
    <noscript>ReceiptKing requires JavaScript to process receipts and create exports.</noscript>

    <script defer src="app.js"></script>
  </body>
</html>
